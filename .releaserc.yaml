---
# This branch-only entry publishes a single v2 maintenance release. It exists on
# fix/v2-dispatch-identifiers and must never be merged to main. The channel is a
# throwaway dist-tag that is removed after publish, so `latest` keeps pointing at
# the v3 line and no standing v2 channel is created.
branches:
  - main
  - name: fix/v2-dispatch-identifiers
    range: 2.33.x
    channel: v2-temp

plugins:
  - '@semantic-release/commit-analyzer'

  - '@semantic-release/release-notes-generator'

  - '@semantic-release/npm'

  - - '@semantic-release/github'
    - releasedLabels: false
      successComment: false

  - - '@semantic-release/exec'
    - successCmd: 'scripts/dispatch-release-notes.sh "${nextRelease.gitTag}"'

  - semantic-release-export-data

analyzeCommits:
  releaseRules:
    - type: build
      release: patch
    - type: build
      scope: dev
      release: false
    - type: docs
      release: patch
      scope: readme
    - type: docs
      release: patch
      scope: readme.md
    - type: docs
      release: patch
      scope: skill
    - type: docs
      release: patch
      scope: skills
    - type: docs
      release: patch
      scope: agents
    - type: docs
      release: patch
      scope: commands

preset: conventionalcommits

presetConfig:
  types:
    - type: feat
      section: Features
    - type: fix
      section: Bug Fixes
    - type: build
      section: Build System
    - type: docs
      section: Documentation
    - type: test
      section: Tests
    - type: ci
      section: Continuous Integration
    - type: style
      section: Styles
    - type: refactor
      section: Code Refactoring
    - type: perf
      section: Performance Improvements
    - type: revert
      section: Reverts
    - type: chore
      section: Miscellaneous Chores

tagFormat: 'v${version}'
