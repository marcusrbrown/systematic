---
_extends: .github:common-settings.yaml

repository:
  name: systematic
  description: Compound-engineering loops for OpenCode, Pi, and Claude Code
  homepage: https://fro.bot/systematic
  topics: opencode, plugin, ai, workflow, systematic, semantic-release, bun

# Applied by the settings workflow, which deletes any ruleset not listed here.
# Environments are managed by hand and must not be declared in this file.
rulesets:
  - name: release-branch
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include: ['refs/heads/release/**']
        exclude: []
    rules:
      - type: creation
      - type: update
      - type: deletion
      - type: non_fast_forward
    bypass_actors:
      # systematic-release GitHub App
      - actor_id: 5287597
        actor_type: Integration
        bypass_mode: always

branches:
  - name: main
    protection:
      required_status_checks:
        strict: true
        contexts:
          [
            Build,
            Docs Build,
            Fro Bot,
            Typecheck,
            Lint,
            Test,
            Registry,
            Release,
            Analyze (typescript),
            CodeQL,
            Renovate / Renovate,
          ]
      enforce_admins: true
      required_pull_request_reviews: null
      restrictions: null
      required_linear_history: true
