---
name: Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Verify plugin loads in Node.js
        run: |
          node --input-type=module -e "
            const m = await import('./dist/index.js');
            const exportKeys = Object.keys(m).sort();
            const expected = ['default'];
            if (JSON.stringify(exportKeys) !== JSON.stringify(expected)) {
              throw new Error('Plugin entry must export only \`default\`. Got: ' + JSON.stringify(exportKeys) + '. Extra named exports break OpenCode plugin loading (the loader treats them as additional plugins and crashes when invoking them with no input). Move helpers to src/lib/.');
            }
            const systematicPlugin = m.default;
            if (typeof systematicPlugin !== 'object' || systematicPlugin === null) {
              throw new Error('Default export must be a plugin object. Got: ' + typeof systematicPlugin);
            }
            if (typeof systematicPlugin.id !== 'string' || typeof systematicPlugin.setup !== 'function' || typeof systematicPlugin.server !== 'function') {
              throw new Error('Default export must have a string id and function setup and server members. Got: ' + JSON.stringify(Object.keys(systematicPlugin)));
            }
            const plugin = await systematicPlugin.server({
              client: { app: { log: async () => {} } },
              directory: process.cwd()
            });
            const config = { agent: {}, command: {}, skill: {} };
            await plugin.config(config);
            const agents = Object.keys(config.agent).length;
            const commands = Object.keys(config.command).length;
            if (agents === 0 || commands === 0) throw new Error('No assets loaded: ' + agents + ' agents, ' + commands + ' commands');
            console.log('Plugin loaded: ' + agents + ' agents, ' + commands + ' commands, tool: ' + (typeof plugin.tool.systematic_skill.execute));

            const piModule = await import('./dist/pi.js');
            const piExportKeys = Object.keys(piModule).sort();
            if (JSON.stringify(piExportKeys) !== JSON.stringify(expected)) {
              throw new Error('Pi entry must export only \`default\`. Got: ' + JSON.stringify(piExportKeys));
            }
            if (typeof piModule.default !== 'function') {
              throw new Error('Pi entry default export must be a function. Got: ' + typeof piModule.default);
            }
            console.log('Pi entry loaded: default export is a function.');

            const cliModule = await import('./dist/cli.js');
            const cliExportKeys = Object.keys(cliModule).sort();
            if (cliExportKeys.length === 0) {
              throw new Error('CLI entry loaded but exported nothing. package.json declares bin.systematic -> ./dist/cli.js, so this entry must resolve under plain Node ESM.');
            }
            console.log('CLI entry loaded: ' + JSON.stringify(cliExportKeys));
          "

      - name: Content integrity gate
        run: bun scripts/content-integrity.ts

      - name: Claude Code plugin build + integrity
        run: bun run claude-code:build

      # One step for every committed generated surface. The list lives in
      # scripts/lib/generated-surfaces.ts; the report names each failing surface.
      - name: Generated surfaces drift check
        run: bun run surfaces:drift

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Required: src/, scripts/, and docs/scripts/ are clean today, so this
      # gate has no backlog to work through.
      - name: Typecheck scripts and docs scripts
        run: bun run typecheck:scripts

      # Required: #897's burn-down cleared the tests/ error backlog (see PR
      # #914, PR #926), so this is a required gate keeping tests + scripts
      # type-clean going forward.
      - name: Typecheck tests and scripts
        run: bun run typecheck:all

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint codebase
        run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test tests/unit

  # The host contract runs as a gate, three host jobs and an aggregator
  # (`Host Contract`). The gate decides whether the contract is required. The
  # v2 shards run the full contract on the pinned v2 CLI, and two v1 jobs run a
  # smoke subset at the v1 floor and at the current v1 pin. The aggregator is
  # the one required status check: it always reports, and it is red unless the
  # contract was either not required or every host job passed. Each job's file
  # list comes from scripts/host-contract-guard.ts (`files --profile <p>`), and
  # the aggregator judges each profile's reports separately.
  host-contract-gate:
    name: Host Contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect relevant path changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            host-contract:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'evals/**'
              - 'skills/**'
              - 'agents/**'
              - 'registry/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/**'

      # Only a pull request runs the suite, and only when the filter above
      # says a relevant path changed. Every other event, push to main
      # included, skips it.
      - name: Determine whether to run the host contract suite
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_RESULT: ${{ steps.filter.outputs.host-contract }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [[ "$FILTER_RESULT" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$FILTER_RESULT" == "false" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            # Fail closed: a malformed or empty paths-filter output must never
            # be treated as "skip and report success", since that would
            # silently satisfy the required status check.
            echo "::error::paths-filter returned an unexpected value: '$FILTER_RESULT' (expected 'true' or 'false')"
            exit 1
          fi

  host-contract-shard:
    name: Host Contract v2 shard ${{ matrix.shard }}/4
    needs: host-contract-gate
    if: needs.host-contract-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The committed timings split the suite by measured duration. 20 minutes
    # leaves wide margin for setup, the CLI install and a slow host, and still
    # fails a hung one well before the old 30-minute ceiling.
    timeout-minutes: 20
    strategy:
      # Let every shard finish: the aggregator needs all four reports to
      # diagnose a red run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Load-bearing: dist/ is gitignored and opencode.test.ts computes
      # DIST_LOCAL_AVAILABLE from dist/index.js at module scope, before any
      # beforeAll can build it. Building first makes that assertion run for real.
      - name: Build
        run: bun run build

      # The v2 CLI needs its install scripts, so `bunx` cannot launch it. It goes
      # into a local prefix and is called by absolute path: v1 and v2 both
      # expose `opencode`, so neither is ever installed globally. npm 12 blocks
      # install scripts unless told otherwise; an older npm runs them and does
      # not know the flag, so the flag is passed only where it exists. A wrong or
      # broken install fails here, with the CLI's own output, before any test.
      - name: Install the OpenCode v2 CLI at its pin
        id: opencode
        run: |
          pin="$(jq -r '.v2' scripts/opencode-host-pins.json)"
          prefix="$RUNNER_TEMP/opencode-v2"
          flags=(--no-audit --no-fund)
          if (( $(npm --version | cut -d. -f1) >= 12 )); then
            flags+=(--dangerously-allow-all-scripts)
          fi
          echo "npm $(npm --version), installing @opencode/cli@${pin} into $prefix"
          npm install --prefix "$prefix" "@opencode/cli@${pin}" "${flags[@]}"
          bin="$prefix/node_modules/.bin/opencode"
          if ! reported="$("$bin" --version 2>&1)"; then
            echo "::error::$bin --version failed: $reported"
            exit 1
          fi
          echo "$bin --version: $reported"
          if [[ "$reported" != "opencode v${pin}" ]]; then
            echo "::error::Expected 'opencode v${pin}' but the installed CLI reported '$reported'"
            exit 1
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Run host contract suite
        id: suite
        env:
          SYSTEMATIC_OPENCODE_HOST: v2
          SYSTEMATIC_OPENCODE_V2_BIN: ${{ steps.opencode.outputs.bin }}
          SYSTEMATIC_REQUIRE_OPENCODE_V2: "1"
        run: |
          set -o pipefail
          files="$(bun scripts/host-contract-guard.ts files --profile v2)"
          readarray -t file_list <<< "$files"
          bun test "${file_list[@]}" \
            --shard=${{ matrix.shard }}/4 \
            --timings=tests/integration/host-contract-timings.json \
            --reporter=junit --reporter-outfile=host-contract-v2-junit-${{ matrix.shard }}.xml \
            2>&1 | tee host-contract-v2-log-${{ matrix.shard }}.txt

      # `!cancelled()` keeps this running after a failed suite, which is when
      # the aggregator most needs the reports. A missing report fails the step.
      - name: Upload shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-contract-v2-shard-${{ matrix.shard }}
          path: |
            host-contract-v2-junit-${{ matrix.shard }}.xml
            host-contract-v2-log-${{ matrix.shard }}.txt
          if-no-files-found: error

  host-contract-v1-floor:
    name: Host Contract v1 floor
    needs: host-contract-gate
    if: needs.host-contract-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # v1 launches through `bunx` at the floor pin. Reporting the version here
      # puts it in the log and fails before any test if it is not the pin.
      - name: Report the OpenCode v1 floor version
        run: |
          pin="$(jq -r '.v1Floor' scripts/opencode-host-pins.json)"
          if ! reported="$(bunx "opencode-ai@${pin}" --version 2>&1)"; then
            echo "::error::bunx opencode-ai@${pin} --version failed: $reported"
            exit 1
          fi
          echo "opencode-ai@${pin} reports: $reported"
          echo "OpenCode v1 floor: $reported" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$(tail -n 1 <<< "$reported")" != "$pin" ]]; then
            echo "::error::Expected '${pin}' but the floor CLI reported '$reported'"
            exit 1
          fi

      - name: Run host contract suite
        id: suite
        env:
          SYSTEMATIC_OPENCODE_HOST: v1
          SYSTEMATIC_OPENCODE_V1_LINE: floor
          SYSTEMATIC_REQUIRE_OPENCODE_V1: "1"
        run: |
          set -o pipefail
          files="$(bun scripts/host-contract-guard.ts files --profile v1-floor)"
          readarray -t file_list <<< "$files"
          bun test "${file_list[@]}" \
            --reporter=junit --reporter-outfile=host-contract-v1-floor-junit.xml \
            2>&1 | tee host-contract-v1-floor-log.txt

      - name: Upload v1 floor results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-contract-v1-floor-results
          path: |
            host-contract-v1-floor-junit.xml
            host-contract-v1-floor-log.txt
          if-no-files-found: error

  host-contract-v1-current:
    name: Host Contract v1 current
    needs: host-contract-gate
    if: needs.host-contract-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Report the OpenCode v1 current version
        run: |
          pin="$(jq -r '.v1' scripts/opencode-host-pins.json)"
          if ! reported="$(bunx "opencode-ai@${pin}" --version 2>&1)"; then
            echo "::error::bunx opencode-ai@${pin} --version failed: $reported"
            exit 1
          fi
          echo "opencode-ai@${pin} reports: $reported"
          echo "OpenCode v1 current: $reported" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$(tail -n 1 <<< "$reported")" != "$pin" ]]; then
            echo "::error::Expected '${pin}' but the current CLI reported '$reported'"
            exit 1
          fi

      - name: Run host contract suite
        id: suite
        env:
          SYSTEMATIC_OPENCODE_HOST: v1
          SYSTEMATIC_OPENCODE_V1_LINE: current
          SYSTEMATIC_REQUIRE_OPENCODE_V1: "1"
        run: |
          set -o pipefail
          files="$(bun scripts/host-contract-guard.ts files --profile v1-current)"
          readarray -t file_list <<< "$files"
          bun test "${file_list[@]}" \
            --reporter=junit --reporter-outfile=host-contract-v1-current-junit.xml \
            2>&1 | tee host-contract-v1-current-log.txt

      - name: Upload v1 current results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-contract-v1-current-results
          path: |
            host-contract-v1-current-junit.xml
            host-contract-v1-current-log.txt
          if-no-files-found: error

  host-contract:
    name: Host Contract
    needs:
      - host-contract-gate
      - host-contract-shard
      - host-contract-v1-floor
      - host-contract-v1-current
    # The required status check. `always()` makes it report whatever the jobs
    # it needs did: a skipped required check reads as success, so this job
    # must never be skipped, and it states its own verdict below.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decide whether the suite was required
        id: verdict
        env:
          GATE_RESULT: ${{ needs.host-contract-gate.result }}
          GATE_RUN: ${{ needs.host-contract-gate.outputs.run }}
        run: |
          if [[ "$GATE_RESULT" != "success" ]]; then
            echo "::error::The host contract gate ended '$GATE_RESULT', not 'success'"
            exit 1
          fi
          if [[ "$GATE_RUN" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GATE_RUN" == "false" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The host contract suite was not required for this run"
          else
            echo "::error::The host contract gate returned an unexpected value: '$GATE_RUN' (expected 'true' or 'false')"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.verdict.outputs.run == 'true'

      - name: Setup Bun
        if: steps.verdict.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        if: steps.verdict.outputs.run == 'true'
        run: bun install --frozen-lockfile

      # Each profile's reports land in their own directory, so one job's files
      # can never overwrite another's. These run after a failed job too: a job
      # that failed after writing its reports still gets the guard's diagnosis.
      - name: Download v2 shard results
        if: ${{ !cancelled() && steps.verdict.outputs.run == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: host-contract-v2-shard-*
          merge-multiple: true
          path: host-contract-results/v2

      - name: Download v1 floor results
        if: ${{ !cancelled() && steps.verdict.outputs.run == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-contract-v1-floor-results
          path: host-contract-results/v1-floor

      - name: Download v1 current results
        if: ${{ !cancelled() && steps.verdict.outputs.run == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-contract-v1-current-results
          path: host-contract-results/v1-current

      # The module-scope throw (SYSTEMATIC_REQUIRE_OPENCODE_V1 or _V2) already
      # covers a missing or mismatched host. This guard covers what it cannot:
      # a per-test gate skipping for an unexpected reason while the job stays
      # green, or a whole-file collapse that still leaves the console summary
      # and pass floor looking plausible. It judges one profile at a time.
      # The file list, exempt skips and floor of each profile live in
      # scripts/host-contract-guard.ts, so widening any of them is a reviewed
      # change.
      #
      # `!cancelled()`, not the implicit `success()`, so a failed job still
      # gets its diagnosis, and each profile gets its own step so one red
      # profile does not hide another. A missing report is a violation, not a
      # skip.
      - name: Guard v2 skipped tests and pass floor
        if: ${{ !cancelled() && steps.verdict.outputs.run == 'true' }}
        run: |
          bun scripts/host-contract-guard.ts --profile v2 \
            host-contract-results/v2/host-contract-v2-junit-1.xml host-contract-results/v2/host-contract-v2-log-1.txt \
            host-contract-results/v2/host-contract-v2-junit-2.xml host-contract-results/v2/host-contract-v2-log-2.txt \
            host-contract-results/v2/host-contract-v2-junit-3.xml host-contract-results/v2/host-contract-v2-log-3.txt \
            host-contract-results/v2/host-contract-v2-junit-4.xml host-contract-results/v2/host-contract-v2-log-4.txt

      - name: Guard v1 floor skipped tests and pass floor
        if: ${{ !cancelled() && steps.verdict.outputs.run == 'true' }}
        run: |
          bun scripts/host-contract-guard.ts --profile v1-floor \
            host-contract-results/v1-floor/host-contract-v1-floor-junit.xml host-contract-results/v1-floor/host-contract-v1-floor-log.txt

      - name: Guard v1 current skipped tests and pass floor
        if: ${{ !cancelled() && steps.verdict.outputs.run == 'true' }}
        run: |
          bun scripts/host-contract-guard.ts --profile v1-current \
            host-contract-results/v1-current/host-contract-v1-current-junit.xml host-contract-results/v1-current/host-contract-v1-current-log.txt

      # The check is red unless every host job succeeded. Each job has its own
      # variable and step. `always()` so each decides even after the steps
      # above failed or were skipped; a skipped or cancelled job is not a pass
      # when the suite was required, and is reported as not required when it
      # was not.
      - name: Require the v2 shards to have succeeded
        if: ${{ always() }}
        env:
          SUITE_REQUIRED: ${{ steps.verdict.outputs.run }}
          V2_SHARDS_RESULT: ${{ needs.host-contract-shard.result }}
        run: |
          if [[ "$SUITE_REQUIRED" == "false" ]]; then
            echo "::notice::The v2 shards were not required for this run"
          elif [[ "$SUITE_REQUIRED" != "true" ]]; then
            echo "::error::The host contract verdict is '$SUITE_REQUIRED', not 'true' or 'false'"
            exit 1
          elif [[ "$V2_SHARDS_RESULT" != "success" ]]; then
            echo "::error::The v2 shards ended '$V2_SHARDS_RESULT', not 'success'"
            exit 1
          fi

      - name: Require the v1 floor job to have succeeded
        if: ${{ always() }}
        env:
          SUITE_REQUIRED: ${{ steps.verdict.outputs.run }}
          V1_FLOOR_RESULT: ${{ needs.host-contract-v1-floor.result }}
        run: |
          if [[ "$SUITE_REQUIRED" == "false" ]]; then
            echo "::notice::The v1 floor job was not required for this run"
          elif [[ "$SUITE_REQUIRED" != "true" ]]; then
            echo "::error::The host contract verdict is '$SUITE_REQUIRED', not 'true' or 'false'"
            exit 1
          elif [[ "$V1_FLOOR_RESULT" != "success" ]]; then
            echo "::error::The v1 floor job ended '$V1_FLOOR_RESULT', not 'success'"
            exit 1
          fi

      - name: Require the v1 current job to have succeeded
        if: ${{ always() }}
        env:
          SUITE_REQUIRED: ${{ steps.verdict.outputs.run }}
          V1_CURRENT_RESULT: ${{ needs.host-contract-v1-current.result }}
        run: |
          if [[ "$SUITE_REQUIRED" == "false" ]]; then
            echo "::notice::The v1 current job was not required for this run"
          elif [[ "$SUITE_REQUIRED" != "true" ]]; then
            echo "::error::The host contract verdict is '$SUITE_REQUIRED', not 'true' or 'false'"
            exit 1
          elif [[ "$V1_CURRENT_RESULT" != "success" ]]; then
            echo "::error::The v1 current job ended '$V1_CURRENT_RESULT', not 'success'"
            exit 1
          fi

  registry:
    name: Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate registry
        run: bun run registry:validate

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # `--with-deps` is deliberately omitted. On ubuntu-latest every system
      # library Playwright requires is already present, so the flag spends most
      # of a minute on `apt-get update` to install CJK, Thai, and Cyrillic fonts
      # that the diagrams do not use. Chromium fails loudly at launch if that
      # ever stops being true.
      - name: Install Playwright Chromium
        run: bun playwright install chromium
        working-directory: docs

      - name: Build docs
        run: bun run docs:build

  # `Release` is a required status context, so this job has no `if:` and no
  # `needs`: it reports on every pull request and every push. It is
  # credential-free by design (contents: read, no secrets, no environment);
  # publishing lives only in release.yaml.
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # On a release/pending PR the head commit is the release commit itself
      # (it only changes CHANGELOG.md), so check out the PR head rather than
      # the synthetic merge commit. An empty `ref` falls back to the default.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.head_ref == 'release/pending' && github.event.pull_request.head.sha || '' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # On release/pending the PR head is the release commit, so render the
      # state it was rendered from: its parent.
      - name: Render release
        env:
          RENDER_SHA: ${{ github.head_ref == 'release/pending' && 'HEAD^' || 'HEAD' }}
        run: bun scripts/release/render.ts --sha "$RENDER_SHA" --out "$RUNNER_TEMP/render"

      - name: Summarize release
        run: |
          set -euo pipefail
          render="$RUNNER_TEMP/render/render.json"
          {
            echo "### Release"
            if [[ "$(jq -r '.kind' "$render")" == "release" ]]; then
              echo "Version: $(jq -r '.version' "$render")"
            else
              echo "nothing releasable"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify release pull request
        if: github.event_name == 'pull_request' && github.head_ref == 'release/pending'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          render="$RUNNER_TEMP/render/render.json"

          if [[ "$(git rev-parse HEAD)" != "$PR_HEAD_SHA" ]]; then
            echo "::error::Checked-out HEAD is not the pull request head $PR_HEAD_SHA"
            exit 1
          fi

          if [[ "$(jq -r '.kind' "$render")" != "release" ]]; then
            echo "::error::release/pending has nothing releasable to render from its parent commit"
            exit 1
          fi

          version="$(jq -r '.version' "$render")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Rendered version is not x.y.z: '$version'"
            exit 1
          fi

          if ! grep -Eq "^## \[?${version//./[.]}([] ]|\$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no heading for version $version"
            exit 1
          fi

          if ! cmp -s "$RUNNER_TEMP/render/CHANGELOG.md" CHANGELOG.md; then
            echo "::error::CHANGELOG.md differs from the rendered changelog for $version"
            exit 1
          fi
