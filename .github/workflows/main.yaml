---
name: Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Dry run
        default: true
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify plugin loads in Node.js
        run: |
          node --input-type=module -e "
            const m = await import('./dist/index.js');
            const exportKeys = Object.keys(m).sort();
            const expected = ['default'];
            if (JSON.stringify(exportKeys) !== JSON.stringify(expected)) {
              throw new Error('Plugin entry must export only \`default\`. Got: ' + JSON.stringify(exportKeys) + '. Extra named exports break OpenCode plugin loading (the loader treats them as additional plugin factories and crashes when invoking them with no input). Move helpers to src/lib/.');
            }
            const pluginFactory = m.default;
            if (typeof pluginFactory !== 'function') {
              throw new Error('Default export must be a function. Got: ' + typeof pluginFactory);
            }
            const plugin = await pluginFactory({
              client: { app: { log: async () => {} } },
              directory: process.cwd()
            });
            const config = { agent: {}, command: {}, skill: {} };
            await plugin.config(config);
            const agents = Object.keys(config.agent).length;
            const commands = Object.keys(config.command).length;
            if (agents === 0 || commands === 0) throw new Error('No assets loaded: ' + agents + ' agents, ' + commands + ' commands');
            console.log('Plugin loaded: ' + agents + ' agents, ' + commands + ' commands, tool: ' + (typeof plugin.tool.systematic_skill.execute));

            const piModule = await import('./dist/pi.js');
            const piExportKeys = Object.keys(piModule).sort();
            if (JSON.stringify(piExportKeys) !== JSON.stringify(expected)) {
              throw new Error('Pi entry must export only \`default\`. Got: ' + JSON.stringify(piExportKeys));
            }
            if (typeof piModule.default !== 'function') {
              throw new Error('Pi entry default export must be a function. Got: ' + typeof piModule.default);
            }
            console.log('Pi entry loaded: default export is a function.');
          "

      - name: Content integrity gate
        run: bun scripts/content-integrity.ts

      - name: Claude Code plugin build + integrity
        run: bun run claude-code:build

      - name: agent-browser skill drift check
        run: bun run agent-browser:drift

      - name: Registry drift check
        run: bun run registry:drift

      - name: Schema drift check
        run: bun run schema:drift

      - name: Review artifact schema drift check
        run: bun run review-schema:drift

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Required: src/, scripts/, and docs/scripts/ are clean today, so this
      # gate has no backlog to work through.
      - name: Typecheck scripts and docs scripts
        run: bun run typecheck:scripts

      # Required: #897's burn-down cleared the tests/ error backlog (see PR
      # #914, PR #926), so this is a required gate keeping tests + scripts
      # type-clean going forward.
      - name: Typecheck tests and scripts
        run: bun run typecheck:all

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint codebase
        run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test tests/unit

  host-contract:
    name: Host Contract
    runs-on: ubuntu-latest
    # Measured on the first real CI run; not summed from per-test ceilings
    # (see the plan's Key Technical Decisions / Unit 4). Re-tune once this
    # job has actually run against a live OpenCode host.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Path gating applies only to pull requests, and only at step level:
      # this job has no top-level `if:`, so it always runs to completion and
      # reports a status. A `needs` dependency that were skipped would skip
      # `release` too, silently publishing nothing on a docs-only PR.
      - name: Detect relevant path changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            host-contract:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'evals/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/main.yaml'

      # On push to main the filter step above is bypassed entirely, so this
      # always resolves to true there. On a pull request it mirrors the
      # filter's verdict. Every later step reads this single output instead
      # of repeating the push-vs-pull_request branch.
      - name: Determine whether to run the host contract suite
        id: gate
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=${{ steps.filter.outputs.host-contract }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        if: steps.gate.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile

      # Load-bearing: dist/ is gitignored, opencode.test.ts computes
      # DIST_LOCAL_AVAILABLE from dist/index.js at module scope, and
      # packTarballOnce() builds inside a beforeAll — too late for that gate.
      # Building first makes the dist-local assertion run for real and turns
      # the in-beforeAll build into a warm no-op.
      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: bun run build

      - name: Run host contract suite
        id: host-contract-run
        if: steps.gate.outputs.run == 'true'
        env:
          SYSTEMATIC_REQUIRE_OPENCODE: '1'
        run: |
          set -o pipefail
          bun test tests/integration \
            --reporter=junit --reporter-outfile=host-contract-junit.xml \
            2>&1 | tee host-contract-log.txt

      # The module-scope throw (SYSTEMATIC_REQUIRE_OPENCODE=1) already covers
      # a missing or mismatched host. This guard covers what it cannot: a
      # per-test gate such as test.skipIf(!DIST_LOCAL_AVAILABLE) skipping for
      # an unexpected reason while the job stays green. The exempt set lives
      # here, next to the guard, so adding an entry is a reviewed change.
      - name: Guard skipped tests and pass floor
        if: steps.gate.outputs.run == 'true'
        run: |
          cat <<'EOF' > host-contract-guard.mjs
          import { readFileSync } from 'node:fs'

          // The only test allowed to skip today: the mixed-version test stays
          // opt-in because enabling it would put a fetch of a published
          // @fro.bot/systematic release on the path that gates publishing the
          // next one.
          const EXEMPT_SKIPS = [
            {
              classname: 'opencode mixed-version integration',
              name: 'pinned package plus local source keep systematic_skill deterministic and converge bootstrap',
            },
          ]

          // Conservative placeholder floor. Re-tune upward from the actual
          // pass count once this job has run against a live OpenCode host
          // (see the plan's Unit 4 deferred item on the measured floor).
          const PASS_FLOOR = 50

          const [, , junitPath, logPath] = process.argv
          const xml = readFileSync(junitPath, 'utf8')

          const testcaseRe = /<testcase\b([^>]*?)(\/>|>[\s\S]*?<\/testcase>)/g
          const attrRe = /(\w+)="([^"]*)"/g

          function parseAttrs(str) {
            const attrs = {}
            let m
            attrRe.lastIndex = 0
            while ((m = attrRe.exec(str))) attrs[m[1]] = m[2]
            return attrs
          }

          const skipped = []
          let match
          while ((match = testcaseRe.exec(xml))) {
            const [, attrStr, rest] = match
            const attrs = parseAttrs(attrStr)
            if (rest.includes('<skipped')) {
              skipped.push({ classname: attrs.classname ?? '', name: attrs.name ?? '' })
            }
          }

          const key = (s) => `${s.classname}::${s.name}`
          const exemptKeys = new Set(EXEMPT_SKIPS.map(key))
          const actualKeys = skipped.map(key)

          const unexpected = actualKeys.filter((k) => !exemptKeys.has(k))
          const missingExempt = [...exemptKeys].filter((k) => !actualKeys.includes(k))

          let failed = false

          if (unexpected.length > 0) {
            console.error('Unexpected skipped test(s) (not in the known-exempt set):')
            for (const k of unexpected) console.error(`  - ${k}`)
            failed = true
          }

          if (missingExempt.length > 0) {
            console.error('Known-exempt skip(s) not found in this run (exempt set is stale):')
            for (const k of missingExempt) console.error(`  - ${k}`)
            failed = true
          }

          const log = readFileSync(logPath, 'utf8')
          const passMatch = log.match(/^\s*(\d+)\s+pass\s*$/m)
          if (!passMatch) {
            console.error('Could not find a "<N> pass" summary line in the captured test output.')
            failed = true
          } else {
            const passCount = Number(passMatch[1])
            console.log(`Observed pass count: ${passCount} (floor: ${PASS_FLOOR})`)
            if (passCount < PASS_FLOOR) {
              console.error(`Pass count ${passCount} is below the floor of ${PASS_FLOOR}.`)
              failed = true
            }
          }

          if (failed) process.exit(1)
          console.log('host-contract skip/pass guard passed.')
          EOF
          bun host-contract-guard.mjs host-contract-junit.xml host-contract-log.txt

      - name: Upload test log on failure
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-contract-log
          path: |
            host-contract-log.txt
            host-contract-junit.xml
          if-no-files-found: ignore

  registry:
    name: Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate registry
        run: bun run registry:validate

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # `--with-deps` is deliberately omitted. On ubuntu-latest every system
      # library Playwright requires is already present, so the flag spends most
      # of a minute on `apt-get update` to install CJK, Thai, and Cyrillic fonts
      # that the diagrams do not use. Chromium fails loudly at launch if that
      # ever stops being true.
      - name: Install Playwright Chromium
        run: bun playwright install chromium
        working-directory: docs

      - name: Build docs
        run: bun run docs:build

  release:
    env:
      # The parentheses are load-bearing. `&&` binds tighter than `||`, and a
      # workflow_dispatch input arrives as a string, so an unparenthesized
      # `inputs.dry-run && 'true'` evaluates truthy even when the caller passes
      # false. Compare against the string explicitly rather than relying on
      # truthiness.
      #
      # This value is the only gate on the dry-run flag. Do not add a step that
      # overrides it for the default branch: semantic-release already refuses to
      # publish from anywhere its own `branches` config does not allow, and an
      # override here silently turns a requested dry run into a real release.
      DRY_RUN: ${{ (github.event_name == 'pull_request' || github.event.inputs.dry-run == 'true') && 'true' || 'false' }}
    name: Release
    needs: [build, typecheck, lint, test, host-contract]
    outputs:
      new-release-published: ${{ steps.semantic-release.outputs.new-release-published }}
      new-release-version: ${{ steps.semantic-release.outputs.new-release-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - id: get-workflow-app-token
        name: Get Workflow Application Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APPLICATION_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}

      - id: setup-git-user
        name: Get GitHub App User ID and Setup Git user
        env:
          GH_TOKEN: ${{ steps.get-workflow-app-token.outputs.token }}
        run: |
          name="${{ steps.get-workflow-app-token.outputs.app-slug }}[bot]"
          user_id=$(gh api "/users/${name}" --jq .id)
          email="${user_id}+${name}@users.noreply.github.com"
          echo "user-email=${email}" >> "$GITHUB_OUTPUT"
          echo "user-name=${name}" >> "$GITHUB_OUTPUT"
          git config --global user.email "${email}"
          git config --global user.name "${name}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.get-workflow-app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js for NPM publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Semantic Release
        id: semantic-release
        env:
          CI_FLAG: ${{ env.DRY_RUN == 'true' && 'false' || 'true' }}
          GIT_AUTHOR_EMAIL: ${{ steps.setup-git-user.outputs.user-email }}
          GIT_AUTHOR_NAME: ${{ steps.setup-git-user.outputs.user-name }}
          GIT_COMMITTER_EMAIL: ${{ steps.setup-git-user.outputs.user-email }}
          GIT_COMMITTER_NAME: ${{ steps.setup-git-user.outputs.user-name }}
          GITHUB_TOKEN: ${{ steps.get-workflow-app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          npx semantic-release --dry-run ${{ env.DRY_RUN }} --ci ${{ env.CI_FLAG }}
        shell: 'bash -Eeuxo pipefail {0}'

  publish-claude-code-plugin:
    name: Publish Claude Code Plugin
    # Publish in lockstep with npm releases: only after the release job cuts a
    # new version, so the plugin branch never ships a non-released or
    # release-failed state. The plugin is still versioned by source commit SHA.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.new-release-published == 'true'
    needs: [build, typecheck, lint, test, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Claude Code plugin
        run: bun run claude-code:build

      - name: Guard built bundle before publish
        run: |
          set -euo pipefail
          required=(
            "claude-code/.claude-plugin/plugin.json"
            "claude-code/skills/using-systematic/SKILL.md"
            "claude-code/output-styles/systematic.md"
            "claude-code/hooks/hooks.json"
            "claude-code/bin/systematic-validate-review-artifact"
          )
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Missing required artifact: $f"
              exit 1
            fi
          done
          if [[ ! -x "claude-code/bin/systematic-validate-review-artifact" ]]; then
            echo "::error::Required artifact is not executable: claude-code/bin/systematic-validate-review-artifact"
            exit 1
          fi
          if ! find claude-code/agents -mindepth 1 -type f | grep -q .; then
            echo "::error::No files found under claude-code/agents/"
            exit 1
          fi
          echo "Guard passed: built bundle looks complete."

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish bundle to claude-code-plugin branch
        run: |
          set -euo pipefail

          WORKTREE_DIR="$(mktemp -d)"
          rm -rf "$WORKTREE_DIR"

          git fetch origin claude-code-plugin || true

          if git show-ref --verify --quiet refs/remotes/origin/claude-code-plugin; then
            git worktree add "$WORKTREE_DIR" claude-code-plugin
          else
            git worktree add --orphan -b claude-code-plugin "$WORKTREE_DIR"
          fi

          # Clear the worktree contents (keep .git) then copy in the fresh build.
          find "$WORKTREE_DIR" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a claude-code/. "$WORKTREE_DIR/"

          cd "$WORKTREE_DIR"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "build(claude-code): publish marcusrbrown/systematic@${GITHUB_SHA}"
          git push origin claude-code-plugin
