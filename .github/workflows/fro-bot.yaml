---
name: Fro Bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  discussion_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request:
    branches: [main, v3]
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
  schedule:
    - cron: '0 9 * * 1'
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Operation mode
        type: choice
        options:
          - review
          - maintenance
          - autoheal
        default: autoheal
      prompt:
        description: >-
          Custom prompt for the Fro Bot agent. When non-empty, this prompt is
          used verbatim regardless of `mode` (this is the path used by the
          release-notes-narrative automation). Required when `mode=review`.
          Ignored only when empty AND `mode` is set to `maintenance` or
          `autoheal` (then the corresponding env prompt is used).
        required: false
        default: ''
      correlation-id:
        description: >-
          Optional UUID for callers that need to identify their dispatched run by
          scanning early log output. The release-notes-narrative automation uses
          this to match its dispatch against gh run list output. Unused by all
          other entry points; the value is informational only and Fro Bot does
          not act on it directly.
        required: false
  workflow_call:
    inputs:
      prompt:
        description: Prompt for the Fro Bot agent
        required: true
        type: string
      correlation-id:
        description: >-
          Optional UUID for callers that need to identify their dispatched run
          by scanning early log output. See workflow_dispatch input of the
          same name.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    fro-bot-${{
      github.event.issue.number ||
      github.event.pull_request.number ||
      github.event.discussion.number ||
      (github.event_name == 'schedule' && github.event.schedule) ||
      github.run_id
    }}
  cancel-in-progress: false

env:
  PR_REVIEW_PROMPT: |
    You are reviewing a TypeScript OpenCode plugin built with Bun. Focus on:
    - Type safety: no `any`, no `@ts-ignore`, explicit return types on exports
    - ESM conventions: `node:` protocol for builtins, `.js` extensions on relative imports
    - Functions over classes — this codebase uses zero classes by convention
    - Error handling: return null/empty for non-critical, throw with context for critical
    - Biome linting compliance (not ESLint/Prettier)
    - Breaking changes to the plugin API (config/tool/system.transform hooks)
    - Security implications for system prompt injection or skill loading
    Skip style nits — Biome handles formatting.

    Do NOT push commits, modify code, or create branches. Review only.
    Use inline comments for file-specific issues. Reserve the review body
    for the structured summary below.

    You MUST structure your review using exactly these headings:
    ## Verdict: [PASS | CONDITIONAL | REJECT]
    CONDITIONAL = can merge after addressing the listed blocking issues.
    ### Blocking issues
    ### Non-blocking concerns
    ### Missing tests
    ### Risk assessment (LOW/MED/HIGH) + rationale
    Evaluate likelihood of regression, security exposure, or blast radius.
    If a section has no items, write "None" under the heading.
    Do not omit any heading.

  MAINTENANCE_PROMPT: |
    Perform weekly repository maintenance for marcusrbrown/systematic — a
    TypeScript OpenCode plugin built with Bun. Update a SINGLE perpetual issue
    titled "Weekly Maintenance Report" in this repository. There must be exactly
    one open maintenance issue at all times.

    Finding the perpetual issue:
    1. Search for an open issue titled "Weekly Maintenance Report" (exact match).
    2. If found, use that issue for all updates.
    3. If not found, create a new issue with that exact title.
    4. If the most recent matching issue is closed, reopen it instead of creating
       a new one.

    Perpetual issue hygiene: after selecting the single rolling issue, search for
    any other open issues with the exact title "Weekly Maintenance Report" or
    "Weekly Maintenance Report — YYYY-MM-DD" and close them with a brief comment
    (e.g., "Consolidating into the perpetual maintenance issue."). There must be
    exactly one open maintenance issue at all times.

    PREPEND a new dated section to the TOP of the issue body using
    "## Update — YYYY-MM-DD (UTC)". Newest update is always first.

    To keep the issue bounded: after prepending today's section, replace any
    individual sections older than 14 days with a single "## Historical Summary"
    section that lists only the count of prior runs and any items that remained
    unresolved across those runs. If a Historical Summary already exists, update
    it in place — do not create a second one.

    When the issue body approaches 50,000 characters, archive older updates by
    removing all but the 30 most recent sections, and note the archival in a
    line like: "_[Archived N older updates on YYYY-MM-DD]_"

    Include links only (no full content duplication). Keep it concise and actionable.
    Flag items that appear in the stale list for the first time (not present in
    the previous dated section) with a ★ marker.

    Sections (in order):
    - Summary metrics (issues opened since last run, currently open PRs, stale
      issues/PRs count, main branch check status, security alerts if accessible)
    - Stale issues (no activity >14 days; recommend next step)
    - Stale PRs (no review activity >7 days)
    - Unassigned bugs (label bug, no assignee)
    - Automation health (workflow runs over last 7 days: success/failure/skipped
      counts per workflow; flag any workflow with >50% failure rate)
    - Recommended actions (bulleted checklist)
    - Notes (use "data unavailable" for any inaccessible data source)

    Do NOT comment on or modify individual issues/PRs (except for closing
    duplicate maintenance issues per the perpetual issue hygiene exception
    above). Do NOT apply labels. Do NOT open PRs. This run must update ONE
    primary issue only (duplicate closures are permitted as the sole exception).

  AUTOHEAL_PROMPT: |
    Perform daily repository autohealing for marcusrbrown/systematic — a
    TypeScript OpenCode plugin built with Bun. Work through each category in
    order and prioritize minimal, reversible changes.

    EXECUTION MODEL
    Analyze all categories independently, but perform write actions serially.
    Do not keep multiple branches checked out at once. Complete one mutation,
    return to a clean working tree, then continue.

    DEDUPLICATION (applies to ALL categories)
    Before creating any new PR or issue, search for an existing open
    bot-authored PR/issue for the same root cause. Reuse or update the
    existing item instead of creating a duplicate.

    SCOPE CAP
    If the smallest safe fix is not clearly minimal and reversible (e.g.,
    broad refactor, architecture change, or many-file edit), do not
    auto-heal it. Open or update an issue and log it under "Needs Human
    Attention".

    DEPENDENCY OWNERSHIP
    Renovate owns routine dependency/version bumps. You may change dependency
    versions only when remediating a confirmed security advisory (critical/high)
    or repairing an existing security-update PR. Do not create non-security
    version-bump PRs, and do not batch unrelated dependency changes into a
    security fix. Do NOT modify package.json versions outside category 2
    security remediation.

    TRUSTED AUTHORS
    Trusted PR authors for branch repair are Marcus and these automation bots:
    - renovate[bot]
    - dependabot[bot]
    - mrbro-bot[bot] (also appears as app/mrbro-bot in GitHub API responses)
    - fro-bot

    1. ERRORED PRs
       Find open PRs with failing CI checks. Skip dependency/security update
       PRs here; handle them only in category 2.
       Only fix PRs whose head branch is in this repository, writable by
       FRO_BOT_PAT, and authored by a trusted source (Marcus, renovate[bot],
       dependabot[bot], mrbro-bot[bot], or fro-bot). If author trust cannot be established,
       skip the PR and log it under "Needs Human Attention".
       If the PR touches `.github/workflows/`, `.releaserc.yaml`, `package.json`,
       `bun.lock`, `scripts/`, or `tsconfig*.json`, do NOT run project commands
       from that branch — skip it and log why.
       For each fixable PR:
       a. Check out the PR branch.
       b. Read the failing check logs to diagnose the root cause.
       c. Fix the issue (type errors, lint failures, test regressions,
          build breaks, content-integrity violations, registry drift).
       d. Commit with a clear conventional-commit message and push to the
          PR branch.
       e. Comment on the PR explaining what failed and what was fixed.
       f. Never modify `.github/workflows/` or this prompt while repairing
          an errored PR. If the failing run appears caused by the Fro Bot
          workflow, skip the PR and log it under "Needs Human Attention".

    2. SECURITY
       Review CodeQL alerts, Dependabot/Renovate security PRs, and GitHub
       Security Advisories for this repo.
       - If a security update PR exists but has conflicts or failures,
         fix and push to that PR branch.
       - For unaddressed critical/high advisories with no existing PR,
         create a new PR with the remediation.
       - Do NOT bulk-update unrelated deps in a security PR.
       If security advisory/alert data is unavailable to FRO_BOT_PAT or `gh`,
       skip this category and note "security alerts unavailable" under
       "Needs Human Attention". Do not guess.

    3. CODE QUALITY & REPO HYGIENE
       This category is primarily report-only. Focus on things only a
       code-aware agent can catch:
       - Run `bun run typecheck` and report any failures.
       - Run `bun run lint` (Biome) and report any failures.
       - Run `bun test tests/unit` and report any failures or new flakes.
       - Run `bun scripts/content-integrity.ts` and report any new phantom
         `systematic:*` refs or banned-pattern hits.
        - Run `bun run registry:drift` and report drift
          (regeneration intent is category 4, not here).
        - Run `bun run schema:drift` and report drift (the JSON Schema
          emitted from the Zod source must stay aligned with the
          committed artifact).
        - Run `bun run docs:build` and report any docs build regressions
          (especially MDX parse errors, Starlight config-shape breaks).
        - Verify convention compliance:
         * `src/index.ts` exports only `default` (one named export breaks
           OpenCode plugin loading — v2.5.2/v2.12.2 regression contract).
         * No `any`, no `@ts-ignore`, no `@ts-expect-error`, no non-null
           assertions (`!`) in source files.
         * No classes in new code (this repo uses zero classes by convention).
         * No `require()` — ESM imports only.
         * Relative imports include `.js` extension.
         * Workflow YAML files use `.yaml` extension, not `.yml`.
         * All third-party GitHub Actions pinned to full SHA, not floating tags.
         * Bundled agent markdown in `agents/**/*.md` does NOT include `model:`
           in frontmatter (content-integrity gate enforces this; double-check
           no recent violations slipped past).
       - Scan for stale TODO/FIXME/HACK annotations older than 90 days via
         git blame. Collect into a single issue or update existing "Stale TODOs"
         issue.
       - Workflow health: check the last 7 days of runs for main.yaml,
         docs.yaml, codeql-analysis.yaml, fro-bot.yaml. Flag any workflow
         with >50% failure rate.
       Report findings; code fixes go in category 4.

    4. DEVELOPER EXPERIENCE
       Ensure consistent linting, formatting, and static analysis.
       Run `bun run fix` (Biome auto-fix). Apply safe mechanical fixes from
       category 3 convention violations where minimal and reversible. Group
       related lint/format/convention fixes into a single PR. Use a clear
       conventional-commit title like
       `chore(lint): apply auto-fixes from autohealing run`.
       Never commit directly to `main` — always open a PR. (Exception: the
       perpetual-issue body updates and PR-branch repair pushes from categories
       1 and 2 are not "default branch writes" so they are allowed.)

    5. QUALITY GATES VERIFICATION
       Verify the project's full quality gate on the default branch:
       a. `bun run typecheck` — 0 errors.
       b. `bun run lint` — 0 errors (warnings reported but acceptable).
       c. `bun test tests/unit` — all tests passing.
       d. `bun run build` — completes without error.
       e. `bun scripts/content-integrity.ts` — 0 violations.
        f. `bun run registry:drift` — 0 drift.
        g. `bun run schema:drift` — 0 drift.
        h. `bun run docs:verify` — completes without error.
        i. Node ESM smoke test:
           `node --input-type=module -e "import('./dist/index.js').then(m => console.log(Object.keys(m).sort()))"`
           — exports only `['default']` (regression contract from v2.5.2/v2.12.2;
           a named export of `SystematicPlugin` breaks OpenCode plugin loading).
        For each failing gate: identify root cause; if fix is minimal and safe,
        include in a category 4 PR; if complex, open an issue with diagnosis.

    6. CROSS-PROJECT INTELLIGENCE (INBOUND ONLY)
       Survey these focus repos for adoptable patterns. Observation only —
       NEVER modify other repos, NEVER open PRs/issues/comments in other repos,
       NEVER clone. All findings go in THIS repo's perpetual autoheal issue only.

       Focus repos (drop ones that consistently have nothing actionable, add
       new ones over time):
       - `marcusrbrown/marcusrbrown` — Fro Bot workflow patterns (source of
         this design).
       - `marcusrbrown/opencode-copilot-delegate` — sibling TS OpenCode plugin;
         check Fro Bot prompt evolution and plugin API patterns.
       - `cortexkit/opencode-magic-context` — companion OpenCode plugin; check
         for conflict-detector / companion-aware patterns relevant to Systematic.
       - `anomalyco/opencode` — OpenCode SDK / plugin loader upstream; check
         release notes for API surface changes that affect Systematic's plugin
         contracts.
       - `fro-bot/agent` — Fro Bot runtime evolution; compare pinned SHA against
         latest.

       For each repo, check:
       a. Fro Bot pinned SHA: compare `fro-bot/agent@` SHA if present.
       b. CI patterns: any workflow improvements worth adopting?
       c. Prompt evolution: any new categories, hygiene rules, or scope caps in
          sibling autoheal/maintenance prompts worth porting?
       d. New conventions worth evaluating.

       Keep findings actionable and specific to marcusrbrown/systematic.
       Skip repos with nothing notable.

       Hard boundaries:
       - NEVER modify other repositories. Observation only.
       - NEVER open PRs, issues, or comments in other repositories.
       - NEVER clone or check out other repositories.
       - All findings go into the perpetual summary issue in THIS repository only.
       - If a `gh` query fails for a repo, skip it and note why.

    7. UPSTREAM MODERNIZATION WATCH (SUNDAYS UTC ONLY)
       Runs only when IS_SUNDAY_UTC=true. Before doing any category 7 work,
       read this environment variable. On other days, skip entirely and omit
       the category 7 section from the daily report.

       Review release notes for pinned upstreams:
       - `fro-bot/agent` used by this workflow.
       - `actions/checkout`, `oven-sh/setup-bun`, `actions/setup-node` used
         across workflows.
       - `anomalyco/opencode` SDK and plugin packages (peer dependency).
       - `@biomejs/biome`, `zod`, `js-yaml`, `jsonc-parser`,
         `@semantic-release/*` (runtime + tooling deps).
       - `@astrojs/starlight`, `@astrojs/mdx`, `astro`, `rehype-mermaid`,
         `playwright` (docs-site deps).

       Document findings in the perpetual issue. Do NOT bump versions (Renovate
       owns that). Do NOT modify upstream repos.

    SINGLE ISSUE MANAGEMENT
    Manage a SINGLE perpetual issue titled "Daily Autohealing Report".

    Finding the perpetual issue:
    1. Search for an open issue titled "Daily Autohealing Report" (exact match).
    2. If found, use that issue for all updates.
    3. If not found, create a new issue with that exact title.
    4. If the most recent matching issue is closed, reopen it instead of
       creating a new one.

    Perpetual issue hygiene: search for any other open issues with titles
    matching "Daily Autohealing Report" or "Daily Autohealing Report — YYYY-MM-DD"
    and close them with a brief comment ("Consolidating into the perpetual report
    issue."), keeping only the most recently updated one. There must be exactly
    one open autohealing issue at all times.

    Updating the issue:
    PREPEND a new dated section to the TOP of the issue body. Newest update is
    always first. If a section has no rows, do not emit an empty table — write
    "None." directly under that heading.

    ## Update — YYYY-MM-DD (UTC)

    ### Errored PRs
    | PR | Failure | Fix | Status |
    | --- | --- | --- | --- |
    | #N | [root cause] | [what was fixed] | ✅ Fixed / ⚠️ Needs review / ⏭️ Skipped |

    ### Security
    | Advisory / PR | Severity | Action Taken |
    | --- | --- | --- |
    | [advisory or #N] | Critical/High/Medium | [fix pushed / PR created / skipped / unavailable] |

    ### Code Quality & Repo Hygiene
    | Check | Result | Action |
    | --- | --- | --- |
    | Typecheck | ✅ Clean / ❌ Errors | [details or #N] |
    | Lint (Biome) | ✅ Clean / ⚠️ Warnings / ❌ Errors | [details or #N] |
    | Tests | ✅ Pass / ❌ Fail | [details or #N] |
    | Content integrity | ✅ Clean / ❌ Violations | [details or #N] |
    | Registry drift | ✅ Aligned / ⚠️ Drift | [details or #N] |
    | Schema drift | ✅ Aligned / ⚠️ Drift | [details or #N] |
    | Docs build | ✅ Pass / ❌ Fail | [details or #N] |
    | Stale TODOs | N found | [#N or None] |
    | Convention drift | ✅ Clean / ⚠️ Issues | [details or #N] |
    | Workflow health | ✅ Healthy / ⚠️ Degraded | [workflow names with stats] |

    ### Developer Experience
    - [list of each PR or commit-sized fix with summary link]

    ### Quality Gates
    | Gate | Status | Details |
    | --- | --- | --- |
    | typecheck | ✅ / ❌ | [error count or clean] |
    | lint | ✅ / ❌ | [error count or clean] |
    | tests | ✅ / ❌ | [pass/fail count] |
    | build | ✅ / ❌ | [details] |
    | content-integrity | ✅ / ❌ | [violation count or clean] |
    | registry drift | ✅ / ❌ | [details] |
    | schema drift | ✅ / ❌ | [details] |
    | docs:verify | ✅ / ❌ | [details] |
    | ESM smoke test | ✅ / ❌ | [exports list or error] |

    ### Cross-Project Intelligence (Inbound)
    | Repo | Finding | Actionable for systematic? | Priority |
    | --- | --- | --- | --- |
    | [repo] | [what they do that we don't] | [specific action or monitor] | High/Med/Low |

    ### Upstream Modernization Watch
    [Sunday-only section. On Sundays UTC, include findings or write "Scan
    clean" if no actionable items. On other days, omit this entire section
    from the daily update.]

    ### Needs Human Attention
    - [items that could not be auto-fixed, with context]

    Rules for the perpetual issue:
    - DO NOT create new daily issues. Always update the perpetual issue.
    - DO NOT close the perpetual issue.
    - ALWAYS prepend new updates to existing content (newest at top).
    - When the issue body approaches 50,000 characters, archive older updates
      by removing all but the 30 most recent dated sections, and note the
      archival in a line like: "_[Archived N older updates on YYYY-MM-DD]_"
    - DO NOT comment on individual issues or PRs unless category 1 fixed a
      failing PR (then ONLY post the fix-summary comment on that PR).

    Hard boundaries:
    - Never force-push, rewrite history, or delete branches.
    - Never push directly to `main`. Direct pushes are allowed only to an
      existing non-default PR branch you are repairing under category 1 or 2.
    - Never merge PRs, submit reviews/approvals, close/reopen PRs or issues,
      or modify branch protection, EXCEPT for closing duplicate "Daily
      Autohealing Report" issues as described in the perpetual issue hygiene
      section above.
    - Never modify secrets, org settings, environments, or branch protection.
    - Never make checks pass by disabling tests, deleting failing assertions,
      lowering coverage budgets, weakening lint rules, or editing
      workflows/configuration only to suppress failures.
    - If the smallest safe fix would weaken a guardrail or reduce validation,
      skip it and log it under "Needs Human Attention".
    - Category 6 (CROSS-PROJECT INTELLIGENCE) MUST NOT modify other repos.
    - Category 7 (UPSTREAM MODERNIZATION WATCH) MUST NOT bump pinned versions
      (Renovate-owned) or modify upstream repositories.
    - Do not create multiple summary issues.
    - Never modify `.releaserc.yaml` or `scripts/dispatch-release-notes.sh`.
      These are the release-notes-narrative automation control surfaces;
      any change here can break the live v2 automation that auto-applies
      narrative release bodies. If a fix appears to require touching them,
      stop and log under "Needs Human Attention".
    - Never manually edit generated artifacts: `dist/registry/`,
      `dist/schemas/`, `docs/public/schemas/`, `dist/index.js`, or
      `dist/cli.js`. These are produced by `bun run build`,
      `bun run registry:build`, `bun run schema:generate`, and the docs
      build. If drift is found, regenerate via the canonical script and
      open a PR with the regenerated output.

    Project conventions (MUST follow for code changes):
    - TypeScript strict mode: no `any`, no `@ts-ignore`, no `@ts-expect-error`,
      no non-null assertions.
    - Functions over classes — this codebase uses zero classes by convention.
    - ESM only — `node:` protocol for builtins, `.js` extensions on relative
      imports, no `require()`.
    - Package manager: `bun` (not npm/yarn/pnpm).
    - Workflow YAML extension: `.yaml`, not `.yml`.
    - Test files in `tests/unit/` and `tests/integration/`, use `bun:test`.
    - Workflow third-party actions pinned to full SHA.
    - `src/index.ts` exports only `default` (one named export breaks OpenCode
      plugin loading — v2.5.2/v2.12.2 regression contract).
    - Bundled agent markdown in `agents/**/*.md` must NOT include `model:` in
      frontmatter.

jobs:
  fro-bot:
    name: Fro Bot
    runs-on: ubuntu-latest
    if: >-
      (
        github.event.pull_request == null ||
        (
          !github.event.pull_request.head.repo.fork &&
          !endsWith(github.event.pull_request.user.login || '', '[bot]')
        )
      ) && (
        (
          github.event_name == 'issues' &&
          !endsWith(github.event.issue.user.login || '', '[bot]') &&
          (github.event.issue.user.login || '') != 'fro-bot' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association || '')
        ) ||
        (
          github.event_name == 'pull_request' &&
          !endsWith(github.event.pull_request.user.login || '', '[bot]') &&
          (github.event.pull_request.user.login || '') != 'fro-bot' &&
          (
            github.event.action != 'review_requested' ||
            (github.event.requested_reviewer.login || '') == 'fro-bot'
          )
        ) ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_call' && inputs.prompt != '') ||
        (
          (github.event_name == 'issue_comment' ||
           github.event_name == 'pull_request_review_comment' ||
           github.event_name == 'discussion_comment') &&
          contains(github.event.comment.body || '', '@fro-bot') &&
          !endsWith(github.event.comment.user.login || '', '[bot]') &&
          (github.event.comment.user.login || '') != 'fro-bot' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || '')
        )
      )
    steps:
      # Fork-guard asymmetry across the four PR-adjacent event types:
      #
      #   pull_request                  github.event.pull_request populated →
      #                                 top-level if: gate catches forks.
      #   pull_request_review_comment   github.event.pull_request populated →
      #                                 top-level if: gate catches forks.
      #   issue_comment                 github.event.pull_request is NULL even
      #                                 when the issue IS a PR (GitHub uses
      #                                 github.event.issue.pull_request instead).
      #                                 Top-level gate cannot see the fork bit,
      #                                 so this explicit API-query step is the
      #                                 only line of defense for this path.
      #   discussion_comment            No PR association possible → fork check
      #                                 is N/A; OWNER/MEMBER/COLLABORATOR
      #                                 association gate alone is sufficient.
      #
      # This step exists ONLY for the issue_comment case. Verified against
      # GitHub webhook docs for each event type's payload shape.
      - name: Refuse fork PR heads from comment triggers
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ secrets.FRO_BOT_PAT }}
        run: |
          pr_number="${{ github.event.issue.number }}"
          is_fork=$(gh api "repos/${{ github.repository }}/pulls/${pr_number}" --jq '.head.repo.fork // "unknown"')
          if [ "$is_fork" != "false" ]; then
            echo "::error::Refusing to check out fork PR head from comment trigger (PR #${pr_number}, fork=${is_fork})."
            exit 1
          fi

      - name: Detect Sunday UTC for category 7 cadence
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            echo "IS_SUNDAY_UTC=true" >> "$GITHUB_ENV"
          else
            echo "IS_SUNDAY_UTC=false" >> "$GITHUB_ENV"
          fi

      - name: Validate review mode inputs
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'review'
        env:
          PROMPT: ${{ inputs.prompt }}
        run: |
          if [ -z "$PROMPT" ]; then
            echo "::error::Review mode requires a custom prompt. Provide one via the 'prompt' input, or choose a different mode."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: >-
            ${{
              (github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number))
              || github.event.pull_request.head.sha
              || ''
            }}
          token: ${{ secrets.FRO_BOT_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Fro Bot
        uses: fro-bot/agent@630b941cd62e55c7c27062563a5bae9310ec4993 # v0.87.0
        env:
          OPENCODE_PROMPT_ARTIFACT: 'true'
          # IS_SUNDAY_UTC is set by the "Detect Sunday UTC" step only on schedule
          # and workflow_dispatch events. For all other entry points (PR review,
          # comment triggers, issue events, workflow_call), the fallback 'false'
          # is correct because category 7 of AUTOHEAL_PROMPT (Upstream
          # Modernization Watch) is the only consumer and only ever runs from
          # the daily autoheal schedule or an autoheal-mode dispatch.
          IS_SUNDAY_UTC: ${{ env.IS_SUNDAY_UTC || 'false' }}
          # PROMPT routing precedence — ORDER MATTERS.
          #
          # Both workflow_call AND workflow_dispatch can carry a non-empty
          # `inputs.prompt`, and both branches MUST come BEFORE the mode-gated
          # branches below. External callers (release-notes-narrative
          # automation via scripts/dispatch-release-notes.sh, manual
          # operators, sister workflows) commonly dispatch with prompt-only
          # and let `mode` default to `autoheal`. If a mode-gated branch
          # captured them first, the supplied prompt would be silently
          # ignored and AUTOHEAL_PROMPT rendered instead — breaking the live
          # release-notes automation contract verified across v2.23.4-v2.24.0.
          #
          # When editing this ternary, walk every event_name × mode × cron
          # combination explicitly. The validate-review-mode-inputs step
          # above only protects against `mode=review` with empty prompt;
          # all other invalid combinations rely entirely on this ordering.
          PROMPT: >-
            ${{
              (github.event_name == 'workflow_call' && inputs.prompt != '' && inputs.prompt)
              || (github.event_name == 'workflow_dispatch' && inputs.prompt != '' && inputs.prompt)
              || (github.event_name == 'workflow_dispatch' && inputs.mode == 'maintenance' && env.MAINTENANCE_PROMPT)
              || (github.event_name == 'workflow_dispatch' && inputs.mode == 'autoheal' && env.AUTOHEAL_PROMPT)
              || (github.event_name == 'workflow_dispatch' && env.AUTOHEAL_PROMPT)
              || (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1' && env.MAINTENANCE_PROMPT)
              || (github.event_name == 'schedule' && github.event.schedule == '30 3 * * *' && env.AUTOHEAL_PROMPT)
              || (github.event_name == 'pull_request' && env.PR_REVIEW_PROMPT)
              || ''
            }}
        with:
          auth-json: ${{ secrets.OPENCODE_AUTH_JSON }}
          github-token: ${{ secrets.FRO_BOT_PAT }}
          model: ${{ vars.FRO_BOT_MODEL }}
          omo-providers: ${{ secrets.OMO_PROVIDERS }}
          opencode-config: ${{ secrets.OPENCODE_CONFIG }}
          prompt: ${{ env.PROMPT }}
          timeout: 0
