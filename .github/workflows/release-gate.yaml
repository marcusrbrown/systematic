name: Release Gate

# Deterministic release gate (no LLM): on Wednesday and Sunday, or when the
# maintainer dispatches it, approve the pending release PR as the gate approver
# and attest that approval. The credentialed jobs run no repository code:
#   decide  - read-only, runs scripts/release/gate-decide.ts
#   approve - holds the approver PAT, uses only gh and jq
#   attest  - holds OIDC, attests the approval subject file
# The publish workflow re-verifies the attestation and the exact PR head.

on:
  schedule:
    - cron: '0 15 * * 0,3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-gate
  cancel-in-progress: false

jobs:
  decide:
    name: Decide
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.actor == 'marcusrbrown' && github.triggering_actor == 'marcusrbrown')
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      kind: ${{ steps.expose.outputs.kind }}
      pr: ${{ steps.expose.outputs.pr }}
      head-sha: ${{ steps.expose.outputs.head-sha }}
      version: ${{ steps.expose.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Required checks: branch-protection contexts in .github/settings.yml minus
      # Fro Bot, CodeQL and Renovate / Renovate (Fro Bot skips bot PRs; Renovate
      # ignores release/**).
      - name: Decide
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_HOLD: ${{ vars.RELEASE_HOLD }}
        run: |
          bun scripts/release/gate-decide.ts --out "$RUNNER_TEMP/gate" \
            --required-check "Build" \
            --required-check "Docs Build" \
            --required-check "Typecheck" \
            --required-check "Lint" \
            --required-check "Test" \
            --required-check "Registry" \
            --required-check "Release" \
            --required-check "Analyze (typescript)"

      - name: Expose decision
        id: expose
        run: |
          gate="$RUNNER_TEMP/gate/gate.json"
          {
            echo "kind=$(jq -r '.kind' "$gate")"
            echo "pr=$(jq -r '.pr // empty' "$gate")"
            echo "head-sha=$(jq -r '.headSha // empty' "$gate")"
            echo "version=$(jq -r '.version // empty' "$gate")"
          } >> "$GITHUB_OUTPUT"
          if [ "$(jq -r '.kind' "$gate")" = skip ]; then
            echo "Release gate skipped: $(jq -r '.reason' "$gate")" >> "$GITHUB_STEP_SUMMARY"
          fi

  approve:
    name: Approve
    runs-on: ubuntu-latest
    needs: decide
    if: needs.decide.outputs.kind == 'approve'
    permissions: {}
    outputs:
      approved: ${{ steps.approve.outputs.approved }}
    steps:
      # Approves the exact head the gate inspected. The head is re-read before
      # and after the approval; a change after the fact dismisses the review, and
      # publish's exact-head check is the backstop if that fails. A release hold
      # is enforced by decide at the start of every run and by publish's verify
      # step, so the approver PAT never needs to read repository variables.
      - name: Approve
        id: approve
        env:
          GH_TOKEN: ${{ secrets.FRO_BOT_PAT }}
          PR: ${{ needs.decide.outputs.pr }}
          HEAD_SHA: ${{ needs.decide.outputs.head-sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/approval"

          current_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "::notice::Not approving: PR head changed since the decision."
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REVIEW_ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" -f commit_id="$HEAD_SHA" -f event=APPROVE -f body="Scheduled release approval for $HEAD_SHA." --jq .id)

          current_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          if [ "$current_head" != "$HEAD_SHA" ]; then
            if ! gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews/$REVIEW_ID/dismissals" -f message="Head changed during approval." -f event=DISMISS > /dev/null; then
              echo "::warning::Could not dismiss review $REVIEW_ID; publish's exact-head check is the backstop."
            fi
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -cjnS --arg headSha "$HEAD_SHA" --argjson pr "$PR" --arg repo "$GITHUB_REPOSITORY" --argjson reviewId "$REVIEW_ID" '{headSha:$headSha,pr:$pr,repo:$repo,reviewId:$reviewId}' > "$RUNNER_TEMP/approval/approval.json"
          echo "approved=true" >> "$GITHUB_OUTPUT"

      - name: Upload approval subject
        if: steps.approve.outputs.approved == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-approval
          path: ${{ runner.temp }}/approval/approval.json
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest
    runs-on: ubuntu-latest
    needs: approve
    if: needs.approve.outputs.approved == 'true'
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download approval subject
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-approval
          path: approval

      - name: Attest approval
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: approval/approval.json
          predicate-type: https://github.com/marcusrbrown/systematic/attestations/release-gate-approval/v1
          predicate: '{}'
