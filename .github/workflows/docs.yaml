name: Docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (optional, semver or v-prefixed)
        required: false
        type: string

concurrency:
  group: docs-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bun --cwd docs x playwright install --with-deps chromium

      - name: Generate reference content
        run: bun run docs:generate

      - name: Resolve registry version
        id: registry-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            version="$RELEASE_TAG"
            version="${version#v}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
            version="${version#v}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version=" >> "$GITHUB_OUTPUT"

      - name: Build registry
        run: |
          if [ -n "${{ steps.registry-version.outputs.version }}" ]; then
            bun scripts/build-registry.ts --version "${{ steps.registry-version.outputs.version }}"
          else
            bun scripts/build-registry.ts
          fi

      - name: Build docs
        run: bun run --cwd docs build

      - name: Copy registry to docs output
        run: cp -r dist/registry/. docs/dist/

      - name: Create GitHub App token
        if: github.repository == 'marcusrbrown/systematic'
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          app-id: ${{ secrets.FRO_BOT_APPLICATION_ID }}
          private-key: ${{ secrets.FRO_BOT_APPLICATION_PRIVATE_KEY }}
          owner: fro-bot

      - name: Deploy to fro-bot/systematic
        if: github.repository == 'marcusrbrown/systematic'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          name="${APP_SLUG}[bot]"
          user_id=$(gh api "/users/${name}" --jq .id)
          email="${user_id}+${name}@users.noreply.github.com"
          git config --global user.email "${email}"
          git config --global user.name "${name}"

          # Verify docs build output exists
          if [ ! -d "docs/dist" ]; then
            echo "✗ Docs build output not found"
            exit 1
          fi

          # Clone deployment repository
          git clone "https://x-access-token:${GH_TOKEN}@github.com/fro-bot/systematic.git" deploy-repo
          cd deploy-repo

          # Create or switch to gh-pages branch
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # Clean and copy new docs (preserve .git directory, include dotfiles)
          find . -mindepth 1 -not -path './.git' -not -path './.git/*' -delete
          cp -r ../docs/dist/. .

          # Commit and push if there are changes
          git add -A
          if ! git diff-index --quiet HEAD -- 2>/dev/null; then
            git commit -m "Deploy docs from marcusrbrown/systematic@${{ github.sha }}"
            git push --force origin gh-pages
          else
            echo "No changes to commit"
          fi
