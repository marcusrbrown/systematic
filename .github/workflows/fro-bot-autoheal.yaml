---
name: Fro Bot Autoheal

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      prompt:
        description: Optional custom prompt (leave empty for default autoheal)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: fro-bot-autoheal
  cancel-in-progress: false

env:
  AUTOHEAL_PROMPT: |
    Perform repository autohealing for systematic. Work through each category
    in order and prioritize minimal, reversible changes.

    1. ERRORED PRs
       Find open PRs with failing CI checks. For each failing PR:
       - Check out the PR branch.
       - Read failing check logs and identify the root cause.
       - Apply a focused fix (type errors, lint failures, test regressions,
         build breaks) and push to the PR branch.
       - Post a concise PR comment: root cause, fix applied, remaining risk.

    2. SECURITY
       Review Dependabot/Renovate alerts and open security PRs:
       - If an existing security PR is failing or conflicted, fix and push.
       - For unaddressed critical/high advisories, open a dedicated PR.
       - Do NOT bundle unrelated upgrades into a security PR.

    3. HEALTH & MAINTENANCE
       - Check for outdated major versions in package.json and GitHub Actions.
       - Pin unpinned Actions to full commit SHA when possible.
       - Create one PR per major dependency migration.

    4. DEVELOPER EXPERIENCE
       - Run `bun run typecheck` and `bun run lint` — fix any failures.
       - Apply safe mechanical fixes (formatting, lint auto-fixes) on PR branches.
       - Prefer opening PRs over direct default-branch writes.

    Hard boundaries:
    - Never force-push, rewrite history, or delete branches.
    - Never modify secrets, org settings, environments, or branch protection.
    - Never change release workflows unless required to fix a failing run and
      the change is scoped and explained.
    - Do not create multiple summary issues.

    OUTPUT FORMAT — SINGLE ROLLING ISSUE
    Update a SINGLE rolling issue titled "Daily Autohealing Report" in
    this repository. Search for an issue with this exact title. If multiple
    matches exist, use the most recently updated one. If no open issue
    exists, create it. If the most recent matching issue is closed, reopen
    it instead of creating a new one.

    Append a new dated section using "## YYYY-MM-DD (UTC)" containing the
    subsections below. To keep the issue bounded: after appending today's
    section, replace any individual sections older than 14 days with a
    single "## Historical Summary" section that lists only the count of
    prior runs and any items that remained unresolved across those runs.
    If a Historical Summary already exists, update it in place — do not
    create a second one.

    Each dated section MUST use this structure:

    ## YYYY-MM-DD (UTC)

    ### Errored PRs
    | PR | Failure | Fix | Status |
    | --- | --- | --- | --- |
    | #N | [root cause] | [what was fixed] | ✅ Fixed / ⚠️ Needs review |

    ### Security
    | Advisory / PR | Severity | Action Taken |
    | --- | --- | --- |
    | [advisory or #N] | Critical/High/Medium | [fix pushed / PR created / skipped] |

    ### Health & Maintenance
    | Dependency | From → To | PR |
    | --- | --- | --- |
    | [package] | vX → vY | #N |

    ### Developer Experience
    - [list of fixes applied]

    ### Needs Human Attention
    - [items that could not be auto-fixed, with context]

    Requirements:
    - Use links only for PRs/issues/commits.
    - If a section has no items, write "None".
    - Keep entries concise and actionable.
    - Do NOT create multiple issues. One rolling issue only.

jobs:
  resolve-prompt:
    name: Resolve Autoheal Prompt
    runs-on: ubuntu-latest
    outputs:
      prompt: ${{ steps.resolve.outputs.prompt }}
    steps:
      - id: resolve
        env:
          INPUT_PROMPT: ${{ github.event.inputs.prompt || '' }}
          DEFAULT_PROMPT: ${{ env.AUTOHEAL_PROMPT }}
        run: |
          delimiter="EOF_$(openssl rand -hex 8)"
          if [ -n "$INPUT_PROMPT" ]; then
            {
              echo "prompt<<$delimiter"
              echo "$INPUT_PROMPT"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "prompt<<$delimiter"
              echo "$DEFAULT_PROMPT"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          fi

  fro-bot-autoheal:
    name: Fro Bot Autoheal
    needs: resolve-prompt
    uses: ./.github/workflows/fro-bot.yaml
    secrets: inherit
    with:
      prompt: ${{ needs.resolve-prompt.outputs.prompt }}
